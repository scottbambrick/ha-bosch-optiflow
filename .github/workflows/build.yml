name: Build

# Compiles the example device against this commit's package and C++ helpers
# (not the published ones), so a change that breaks the build is caught.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # Code style: ESPHome's (Google-based) .clang-format for the C++ and ruff for the Python.
    # If anything is off, the format-fixes artifact holds a patch with the formatters' changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the formatters
        run: pip install "clang-format==13.0.1" "ruff==0.16.10"
      - name: Run the formatters
        run: |
          git ls-files '*.c' '*.cpp' '*.h' '*.ino' | xargs -r clang-format -i --style=file
          ruff check --fix --exit-zero --quiet .
          ruff format --quiet .
          git diff > format-fixes.patch
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: format-fixes
          path: format-fixes.patch
      - name: Check formatting
        run: git diff --stat --exit-code
      - name: Python lint (ruff check)
        if: ${{ !cancelled() }}
        run: ruff check --output-format=github .

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install "esphome==2026.10.1"
      - name: Use this checkout's package, add dummy secrets
        run: |
          sed 's#bosch: github://scottbambrick/ha-bosch-optiflow/packages/bosch-optiflow.yaml@main#bosch: !include packages/bosch-optiflow.yaml#' \
            examples/hot-water-monitor.yaml > ci.yaml
          grep -q "!include packages/bosch-optiflow.yaml" ci.yaml
          printf 'api_key: "%s"\nwifi_ssid: "ci"\nwifi_password: "ci-password"\n' \
            "$(openssl rand -base64 32)" > secrets.yaml
      - name: Validate
        run: esphome -s bosch_ref "$GITHUB_SHA" config ci.yaml > validated.txt || { cat validated.txt; exit 1; }
      - name: Compile
        run: esphome -s bosch_ref "$GITHUB_SHA" compile ci.yaml
