button:
  # Disconnect from the heater and stop auto-reconnecting (e.g. to let the
  # Bosch app take over, or to free the heater's single BLE slot temporarily).
  - platform: template
    name: "Hot Water Disconnect"
    icon: "mdi:bluetooth-off"
    entity_category: config
    on_press:
      - lambda: |-
          ESP_LOGI("bosch", "Disconnect requested - disabling auto-connect");
          id(bosch_heater)->set_enabled(false);
          id(bosch_heater)->disconnect();

  # Re-enable auto-connect after a manual disconnect. The heater's BLE stack
  # needs a moment to register the previous disconnection before it will
  # advertise again, so there is a short delay before the connect attempt.
  - platform: template
    name: "Hot Water Reconnect"
    icon: "mdi:bluetooth-connect"
    entity_category: config
    on_press:
      - lambda: |-
          ESP_LOGI("bosch", "Reconnect requested - re-enabling auto-connect");
          id(bosch_heater)->set_enabled(true);

number:
  # Sets the target temperature (37-50 °C). Its displayed value is pushed
  # from the heater's own broadcasts, so it also follows the wired controller.
  - platform: template
    id: hw_setpoint_control
    name: "Hot Water Set Temperature"
    icon: "mdi:thermometer-plus"
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 37
    max_value: 50
    step: 1
    mode: slider
    set_action:
      - if:
          # Same rule as the app: no changes while a bathroom controller
          # owns the setpoint.
          condition:
            binary_sensor.is_on: hw_bathroom_ctrl
          then:
            - logger.log:
                level: WARN
                tag: bosch
                format: "Can't change temperature - bathroom controller active"
            - lambda: |-
                if (id(hw_target_temp).has_state())
                  id(hw_setpoint_control).publish_state(id(hw_target_temp).state);
          else:
            # 0xD3 write param: location 2, param 0x55 (setpoint), 16-bit value
            - script.execute:
                id: bosch_send
                cmd: 211
                payload: !lambda |-
                  int t = (int) lroundf(x);
                  if (t < 37) t = 37;
                  if (t > 50) t = 50;
                  ESP_LOGI("bosch", "Requesting target temperature %d °C", t);
                  return std::vector<int>{2, 0x55, 0, t};